<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CARE AI - Trợ lý Tư vấn Tâm lý Học đường</title>
</head>
<body>
    <div id="app" style="padding: 20px; font-family: sans-serif;">
        <h1>CARE AI - Trợ lý Tư vấn Tâm lý Học đường</h1>
        <div id="chat-container" style="border: 1px solid #ccc; padding: 15px; height: 300px; overflow-y: scroll; margin-bottom: 10px;"></div>
        <input type="text" id="userInput" placeholder="Nhập tâm sự của em..." style="width: 70%; padding: 10px;" />
        <button onclick="handleSend()" style="padding: 10px 20px;">Gửi</button>
    </div>

    <script>
        async function sendMessage(userText) {
            const apiKey = "AQ.Ab8RN6LguUo-vcNut1OGoEVyMWcKvz0mVwVY8Du8VZezjANamQ"; // API Key của bạn
            const model = "gemini-3.5-flash-lite";

            try {
                const response = await fetch(
                    `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`,
                    {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            contents: [{ role: "user", parts: [{ text: userText }] }]
                        })
                    }
                );

                const result = await response.json();
                
                if (!response.ok) {
                    throw new Error(result.error?.message || "Lỗi kết nối API");
                }

                const reply = (result.candidates || []).flatMap(
                    candidate => candidate.content && candidate.content.parts || []
                ).map(part => part.text).join("\n").trim();

                return reply || "Em hãy thử lại sau nhé.";
            } catch (error) {
                console.error("Lỗi chi tiết:", error);
                return "Hệ thống đang bận, em hãy thử lại sau nhé.";
            }
        }

        async function handleSend() {
            const input = document.getElementById("userInput");
            const container = document.getElementById("chat-container");
            const text = input.value.trim();
            if (!text) return;
            
            container.innerHTML += `<p><b>Học sinh:</b> ${text}</p>`;
            input.value = "";

            const reply = await sendMessage(text);
            
            container.innerHTML += `<p style="color: blue;"><b>CARE AI:</b> ${reply}</p>`;
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
