<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CARE AI - Trợ lý Tư vấn Tâm lý Học đường</title>
</head>
<body>
    <div id="app">
        <h1>CARE AI</h1>
        <div id="chat-container"></div>
        <input type="text" id="userInput" placeholder="Nhập tâm sự của em..." />
        <button onclick="handleSend()">Gửi</button>
    </div>

    <script>
        // Hàm gọi trực tiếp Gemini API từ Frontend (trình duyệt)
        async function sendMessageToGemini(userText) {
            const apiKey = "AQ.Ab8RN6LguUo-vcNut1OGoEVyMWcKvz0mVwVY8Du8VZezjANamQ";
            const model = "gemini-3.5-flash-lite"; // Đã sửa lại tên model chuẩn

            try {
                const response = await fetch(
                    `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`,
                    {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            contents: [{ role: "user", parts: [{ text: userText }] }]
                        })
                    }
                );

                const result = await response.json();
                
                if (!response.ok) {
                    throw new Error(result.error?.message || "Lỗi kết nối API");
                }

                const reply = (result.candidates || []).flatMap(
                    candidate => candidate.content && candidate.content.parts || []
                ).map(part => part.text).join("\n").trim();

                return reply || "Em hãy thử lại sau nhé.";
            } catch (error) {
                console.error("Lỗi:", error);
                return "Hệ thống đang bận, em hãy thử lại sau nhé.";
            }
        }

        async function handleSend() {
            const input = document.getElementById("userInput");
            const text = input.value.trim();
            if (!text) return;
            
            console.log("Đang gửi:", text);
            const reply = await sendMessageToGemini(text);
            alert(reply); 
        }
    </script>
</body>
</html>
